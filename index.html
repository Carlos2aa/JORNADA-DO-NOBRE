<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Protótipo completo · Jornada do Noble</title>
<style>
:root{--pale:#efdbac;--muted:#a9a79c;--gold:#c8aa70}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#e0d9c7;font:15px Georgia,serif;background:radial-gradient(ellipse at top,#34413e,#12191a 48%,#070a0b) fixed}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#0b1111cc;border-right:1px solid #5c513d;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{color:var(--pale);letter-spacing:2px;font-size:15px;margin:4px 8px 22px}
.brand small{display:block;color:var(--muted);letter-spacing:1px;font-size:11px;margin-top:4px}
.sec{color:#8f8771;font:11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;margin:18px 10px 6px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:#e6dcc0;padding:10px 12px;border-radius:4px}
.nav:hover{background:#1c2421}
.grp{margin:0 0 4px}.grp-h{cursor:pointer;color:#cbb17d;padding:8px 12px;list-style:none;border-radius:4px;font-size:15px}.grp-h::-webkit-details-marker{display:none}.grp-h:before{content:'▸ ';color:#8f8771}.grp[open] .grp-h:before{content:'▾ '}.grp-h:hover{background:#1c2421}.nav.sub{padding-left:28px;font-size:14px}
.nav.on{background:linear-gradient(#7d6947,#39352a);color:#fff}
main{padding:28px 32px 90px;max-width:980px;width:100%}
h1{font-weight:normal;color:var(--pale);margin:0 0 6px;font-size:28px;letter-spacing:1px}
.sub{color:var(--muted);margin:0 0 20px;font:14px Arial,sans-serif}
.search{width:100%;padding:12px 14px;background:#0b1111;border:1px solid #776444;color:#f4e8c7;font:15px Arial,sans-serif;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:linear-gradient(130deg,#222b2bdd,#101718f2);border:1px solid #776444;padding:18px}
.card h3{margin:0 0 6px;font-weight:normal;color:#e1c58b;font-size:18px}
.card p{margin:4px 0;color:#cfc7ae;font:14px Arial,sans-serif}
.bar{height:8px;background:#080c0c;border:1px solid #8b764d;margin:12px 0 6px;max-width:520px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#536f59,#c7ad72)}
.next{color:#f4d16d;font:13px Arial,sans-serif}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #4b4330;font:14px Arial,sans-serif}
.boss{color:#ff6666;font-weight:bold}
.seal{display:table;margin:6px 0 0;padding:4px 10px;background:linear-gradient(#b02a2a,#6e1313);border:1px solid #ff6b6b;color:#fff0f0;font:bold 13px Arial,sans-serif;border-radius:4px;box-shadow:0 0 8px #7a1616}
.tl{position:relative;margin-left:10px;padding-left:34px}
.tl:before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:2px;background:#5c513d}
.node{position:relative;margin:0 0 18px;padding:14px 16px;background:#101718cc;border:1px solid #4b4330;cursor:pointer}
.node:before{content:"";position:absolute;left:-29px;top:18px;width:14px;height:14px;border-radius:50%;background:#1c2421;border:2px solid #8b764d}
.node.done{opacity:.6}
.node.done:before{background:#3e7a50;border-color:#83aa90}
.node.current{border-color:#c8aa70;box-shadow:0 0 12px #c8aa7055}
.node.current:before{background:#d9b879}
.node .num{color:#cbb17d;font:12px Arial,sans-serif;letter-spacing:1px}
.node h4{margin:4px 0;font-weight:normal;color:#e1c58b;font-size:17px}
.node.done h4{text-decoration:line-through}
.node.done:after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#3e7a50;border-radius:4px 4px 0 0}
.node p{margin:6px 0 0;color:#cfc7ae;font:14px Arial,sans-serif;line-height:1.5}
.box{border:1px solid #61573f;background:#0b1111;padding:14px 16px;margin-top:14px}
.label{color:#b5aa8e;font:11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:block}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px;background:linear-gradient(#454b42,#1c2421);color:#e6dcc0;border:1px solid #6b6853;border-radius:3px;font:13px Arial,sans-serif;line-height:1.3}
.seg button.on{background:linear-gradient(#7d6947,#39352a);border-color:#c8aa70;color:#fff;font-weight:bold}
.seg small{font-weight:normal;opacity:.8}
.field{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.field input[type=time]{background:#111512;border:1px solid #6b6853;color:#f4e8c7;padding:9px;font:14px Arial,sans-serif;color-scheme:dark}
.btn{padding:8px 14px;border-radius:3px;font:13px Arial,sans-serif;color:#ebd6aa;background:linear-gradient(#454b42,#1c2421);border:1px solid #a18a57}
.btn.ok{background:linear-gradient(#3e7a50,#1d3a27);border-color:#4f9a64;color:#d8f5e0}
.btn.no{background:linear-gradient(#4a4a4a,#262626);border-color:#6a6a6a;color:#cfcfcf}
.selo{margin-top:12px;padding:9px 12px;border-left:3px solid #85d69b;background:#101a13;color:#cfe9d6;font:13px Arial,sans-serif;line-height:1.5;display:none}
.selo.on{display:block}
.muted{color:var(--muted);font:13px Arial,sans-serif}
.bottom{display:none}
@media(max-width:760px){
  .app{grid-template-columns:1fr}aside{display:none}
  main{padding:20px 16px 90px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#0b1111f2;border-top:1px solid #5c513d;justify-content:space-around;padding:8px 4px;z-index:5}
  .bottom button{background:none;border:0;color:#cfc7ae;font:11px Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 4px}
  .bottom button.on{color:#f4d16d}
  .bottom .i{font-size:20px}
}
.it{color:#ffffff;font-weight:bold}
.npc-y{color:#f4d16d;font-weight:bold}
.mon{color:#ff9a9a;font-weight:bold}
</style></head>

<script>
const STEPS=[{"n": 1, "q": "Fate's Whisper", "t": "Maestro Reorin NPC", "d": "Nível 75+. Aceite Fate's Whisper com o Reorin NPC.", "loc": "Perto de Oren"}, {"n": 2, "q": "Fate's Whisper", "t": "Shilen's Messenger Cabrio RAID BOSS", "d": "Após a morte de Shilen's Messenger Cabrio (RAID BOSS), abra Coffer of the Dead e pegue 1 Reiria's Soul Orb ITEM. Volte ao Reorin NPC. Pré-requisito: ter aceito Fate's Whisper com o Reorin (etapa 1).", "loc": "Cemitery"}, {"n": 3, "q": "Fate's Whisper", "t": "Death Lord Hallate RAID BOSS", "d": "Após a morte, abra o baú e receba 1 Hallate's Infernium Scepter ITEM.", "loc": "Tower of Insolence — 3º andar"}, {"n": 4, "q": "Fate's Whisper", "t": "Kernon RAID BOSS", "d": "Após a morte, abra o baú e receba 1 Kernon's Infernium Scepter ITEM.", "loc": "Tower of Insolence — 8º andar"}, {"n": 5, "q": "Fate's Whisper", "t": "Longhorn Golkonda RAID BOSS", "d": "Após a morte, abra o baú e receba 1 Golkonda's Infernium Scepter ITEM. Entregue os três cetros (ITENS) ao Reorin NPC.", "loc": "Tower of Insolence — 11º andar"}, {"n": 6, "q": "Fate's Whisper", "t": "Warehouse Freightman Cliff NPC", "d": "Pegue 1 Infernium Varnish ITEM e entregue ao Reorin NPC. Pré-requisito: ter entregue os três Infernium Scepters ao Reorin (etapa 5).", "loc": "Oren, Warehouse"}, {"n": 7, "q": "Fate's Whisper", "t": "Head Blacksmith Ferris NPC", "d": "Pegue 1 Maestro Reorin's Hammer ITEM e entregue ao Reorin NPC.", "loc": "Aden, Blacksmith"}, {"n": 8, "q": "Fate's Whisper", "t": "Trader Zenkin NPC", "d": "Pergunte pelo molde ITEM do Reorin NPC. O Zenkin NPC informa que o vendeu ao Kaspar NPC.", "loc": "Oren, Weapon & Armor Shop"}, {"n": 9, "q": "Fate's Whisper", "t": "Magister Kaspar NPC", "d": "Fale sobre o molde ITEM e receba 1 Pipette Knife ITEM.", "loc": "Hardin’s Private Academy"}, {"n": 10, "q": "Fate's Whisper", "t": "Maria (NPC) — atalho Eternal x10", "d": "Troque Pipette Knife ITEM por 1 Red Pipette Knife ITEM. No Eternal NÃO é necessário acessar Baium para essa etapa.", "loc": "Qualquer cidade (normalmente perto da GK)"}, {"n": 11, "q": "Fate's Whisper", "t": "Kaspar NPC e Reorin NPC", "d": "Entregue Red Pipette Knife ITEM ao Kaspar NPC, receba 1 Maestro Reorin's Mold ITEM e leve-o ao Reorin NPC. Pré-requisito: ter o Red Pipette Knife, obtido na etapa 10. Antes de ir até o Reorin, compre: 984 Crystal: B-Grade e 1 arma Top B (Art of Battle Axe, por exemplo).", "loc": "Hardin's Academy → Skyshadow Meadow, perto de Oren"}, {"n": 12, "q": "Fate's Whisper", "t": "Troca final do Reorin NPC", "d": "Entregue 984 Crystal: B-Grade e a arma Top B. O Reorin vai pedir para você escolher uma nova arma A, pense bem na escolha pois ela serve para sua nova subclasse e receba Star of Destiny.", "loc": "Skyshadow Meadow, perto de Oren"}, {"n": 13, "q": "Mimir's Elixir", "t": "Magister Ladd NPC", "d": "Com Star of Destiny ITEM, aceite Mimir's Elixir ITEM. Ele pede 1 Pure Silver ITEM. Pré-requisito: ter o Star of Destiny, recebido na etapa 12.", "loc": "Ivory Tower — 4º andar"}, {"n": 14, "q": "Mimir's Elixir", "t": "Magic Trader Wesley NPC", "d": "Aceite Supplier of Reagents. Reúna 100 Moonstone Shard ITEM, 10 Volcanic Ash ITEM e 2 Quicksilver ITEM. Farm: Hames Orc Shaman em Blazing Swamp (abra Reagent Pouches ITEM); também há materiais (ITENS) na TOI ou no comércio entre jogadores. Pré-requisito: nenhum item de etapa anterior; aceite Supplier of Reagents com o Wesley.", "loc": "Ivory Tower — subsolo"}, {"n": 15, "q": "Mimir's Elixir", "t": "Obtenção de Pure Silver ITEM", "d": "Atalho Eternal x10: Troque diretamente 100 Moonstone Shard ITEM por 1 Pure Silver ITEM com a Maria NPC. Método tradicional (Urna): Use a 1ª temperatura (Salamander) na Alchemist's Mixing Urn com a Wesley's Mixing Stone ITEM (10 Moonstone Shard ITEM + 1 Volcanic Ash ITEM = Moon Dust ITEM, combinando com Quicksilver ITEM até Lunargent ITEM e Pure Silver ITEM). Use apenas a 1ª temperatura nesta urna; a 3ª (Phoenix) é reservada para a mistura final da etapa 19.", "loc": "Subsolo da Ivory Tower ou NPC Maria"}, {"n": 16, "q": "Mimir's Elixir", "t": "Ladd NPC → Magister Joan NPC", "d": "Fale com o Ladd NPC sobre o Pure Silver ITEM. A Joan NPC pede 1 Sage's Stone ITEM. Pré-requisito: ter o Pure Silver, obtido na etapa 15.", "loc": "Ivory Tower: Ladd 4º andar; Joan 3º andar"}, {"n": 17, "q": "Mimir's Elixir", "t": "Chimera Piece", "d": "Mate o Chimera Piece até conseguir 1 Sage's Stone ITEM. Entregue à Joan NPC e receba 1 True Gold ITEM. Retorne ao Ladd NPC. Pré-requisito: a Joan precisa da Sage's Stone pedida na etapa 16.", "loc": "Silent Valley, abaixo de Giant Caves (por fora)"}, {"n": 18, "q": "Mimir's Elixir", "t": "Bloody Guardian", "d": "Mate o Bloody Guardian até receber 1 Blood Fire. Área perigosa", "loc": "Antharas’ Lair"}, {"n": 19, "q": "Mimir's Elixir", "t": "Mistura final", "d": "Combine 1 Pure Silver ITEM + 1 True Gold ITEM + 1 Blood Fire ITEM usando obrigatoriamente a 3ª temperatura (Phoenix). Receba 1 Mimir's Elixir ITEM. Pré-requisito: ter Pure Silver (etapa 15), True Gold (etapa 17) e Blood Fire (etapa 18).", "loc": "Alchemist's Mixing Urn, subsolo da Ivory Tower"}, {"n": 20, "q": "Mimir's Elixir", "t": "Concluir com o Ladd NPC", "d": "Escolha 'Drink the elixir' no diálogo do Ladd. Depois procure a Maria para adicionar sua nova subclasse.", "loc": "Ivory Tower, 4º andar"}, {"n": 21, "q": "Nobless", "t": "Talien NPC", "d": "Fale com o Talien NPC para iniciar a quest da Parte 1. Parte 1 · requisito: subclasse nível 50 (conforme as fontes).", "loc": "Aden"}, {"n": 22, "q": "Nobless", "t": "Gabriele NPC", "d": "Fale com a Gabriele NPC. Escolha a opção inferior do menu.", "loc": "Giran"}, {"n": 23, "q": "Nobless", "t": "Gilmore NPC", "d": "Fale com o Gilmore NPC.", "loc": "Death Pass"}, {"n": 24, "q": "Nobless", "t": "Baraham (medusa)", "d": "Vá a Dion, depois a Bee Hive, entre na caverna e mate a medusa Baraham para receber Legend of Seventeen ITEM.", "loc": "Bee Hive, dentro da caverna (após Dion)"}, {"n": 25, "q": "Nobless", "t": "Kantabilon NPC", "d": "Volte ao Talien NPC e depois vá ao Kantabilon NPC. O Kantabilon NPC pede 10 Malruk Succubus Claw ITEM. Escolha a opção inferior.", "loc": "Heine, Grocery Store"}, {"n": 26, "q": "Nobless", "t": "Malruk Succubus", "d": "Mate Malruk Succubus ou Malruk Succubus Turen até obter 10 Malruk Succubus Claw ITEM. O drop é lento. (A lenda diz que matando batendo sem soulshots cai mais rápido). Entregue ao Kantabilon e receba Echo Crystal – Forgotten Song ITEM.", "loc": "Dragon Valley"}, {"n": 27, "q": "Nobless", "t": "Stedmiel NPC, Virgil NPC, Ogmar NPC, Rahorakti NPC", "d": "Siga a cadeia: Talien NPC (Aden) → Stedmiel NPC (Hunters Village, Warrior Guild) → Talien NPC (Aden) → Virgil NPC (Rune, sacada do Templo) → Ogmar NPC (Rune, sacada do Templo) → Rahorakti NPC (Rune, Mystic Guild). O Rahorakti pede 5 Crimson Moss ITEM.", "loc": "Aden → Hunters Village → Rune"}, {"n": 28, "q": "Nobless", "t": "Splinter Stakato Drones", "d": "Teleporte até Swamp of Screams e mate Splinter Stakato Drones (também Walkers e Soldiers) até obter 5 Crimson Moss ITEM. Volte ao Rahorakti e receba Mirakulous Medicine ITEM.", "loc": "Swamp of Screams"}, {"n": 29, "q": "Nobless", "t": "Kassandra NPC", "d": "Entregue o Mirakulous Medicine ITEM à Kassandra NPC. Depois volte ao Virgil NPC, que manda para a Caradine NPC.", "loc": "Rune, sacada do Templo"}, {"n": 30, "q": "Nobless", "t": "Caradine NPC e Noel NPC", "d": "Fale com a Caradine NPC. Ela manda ao Noel NPC, que pede Hellfire Oil ITEM e 5 Lunargents ITEM. Entregue com a subclasse ativa.", "loc": "Caradine: Goddard, em frente à Magic Shop · Noel: Goddard, Blacksmith"}, {"n": 31, "q": "Nobless", "t": "Preparar Hellfire Oil e 5 Lunargents", "d": "Crie os itens no caldeirão perto do Wesley NPC. Os Lunargents ITEM vêm da quest Supplier of Reagents (etapa 14). A lista de materiais está na aba Inventário. Atalho Eternal x10: a Maria NPC troca 500 Moonstone Shard ITEM por 5 Lunargents ITEM. Para o Hellfire Oil ITEM, use 100 Lava Stone ITEM (drop do Hames Orc Shaman, Blazing Swamp) 100 Demon Blood ITEM (drop do Hallate's Guardian, TOI 5).", "loc": "Ivory Tower, caldeirão perto do Wesley"}, {"n": 32, "q": "Nobless", "t": "Caradine NPC → Virgil NPC", "d": "Volte ao Caradine NPC e escolha a opção superior do menu para receber Virgil's Letter ITEM. Leve ao Virgil NPC, que diz que a Kassandra NPC precisa de ajuda. Fim da Parte 1.", "loc": ""}, {"n": 33, "q": "Nobless", "t": "Kassandra NPC, Ogmar NPC e Mysterious Dark Knight", "d": "Fale com a Kassandra NPC, depois com o Ogmar NPC, depois com o Mysterious Dark Knight em Devil's Pass. Fale com os anjos mortos ao redor; cada um some, exceto o último. Volte ao Knight, que manda à Witch Kalis NPC. Parte 2 · requisito: subclasse nível 60 e Parte 1 concluída.", "loc": "Devil's Pass"}, {"n": 34, "q": "Nobless", "t": "Witch Kalis NPC e Matild NPC", "d": "A Kalis manda à Matild NPC, que entrega Sorcery Ingredient ITEM. Volte à Kalis, que recebe o item e manda ao Valley of Saints.", "loc": "Kalis entre Ivory Tower e Tower of Insolence; Matild entre Seal of Spores e Ivory Tower"}, {"n": 35, "q": "Nobless", "t": "Quest Monsters Restrainer of Glory", "d": "Na caverna com um unicórnio morto entre quatro pilares, mate os de quest até obter 4 Orb of Binding ITEM. Coloque um orb em cada pilar, reviva o unicórnio e use um Scroll of Escape ITEM para voltar a Rune. A Kassandra NPC entrega Caradine's Letter ITEM; leve à Caradine NPC.", "loc": "Valley of Saints"}, {"n": 36, "q": "Nobless", "t": "Caradine NPC e Ossian NPC", "d": "Entregue Caradine's Letter ITEM à Caradine NPC. Ela manda ao Ossian NPC, que pede Ring of Goddess ITEM e Necklace of Goddess ITEM. Parte 3 · requisito: subclasse nível 65 e Partes 1 e 2 concluídas.", "loc": "Goddard, em frente à Magic Shop"}, {"n": 37, "q": "Nobless", "t": "Pilgrim of Splendor e Judge of Splendor", "d": "Colete Ring of Goddess (o anel demora) e Necklace of Goddess, depois leve ao Ossian.", "loc": "Valley of Saints"}, {"n": 38, "q": "Nobless", "t": "Flame of Shine Barakiel RAID BOSS", "d": "Mate o Flame of Shine Barakiel RAID BOSS para obter Staff of Goddess: Rain Song ITEM. Leve grupo. O item vai para quem tem a quest, mesmo em grupo.", "loc": "Valley of Saints"}, {"n": 39, "q": "Nobless", "t": "Ossian NPC → Magister Ladd NPC", "d": "Volte ao Ossian NPC com o staff e receba Relic Box ITEM. Entregue ao Magister Ladd NPC (opção inferior). Ele entrega Caradine's Letter ITEM. Fim da Parte 3.", "loc": "Ivory Tower, 4º andar (Ladd)"}, {"n": 40, "q": "Nobless", "t": "Lady of Lake (necessário subclasse nível 75)", "d": "A Caradine teleporta você até a Lady of Lake. Fale com ela para receber o título de Noble e as skills de Noble. Quest concluída, parabéns!", "loc": "Perto da entrada do Coliseu"}];

const THIRD={"Arcana Lord": [["1", "Vá para Ivory Tower e fale com o Head Summoner Kinsley."], ["2", "Em seguida, vá até Goddard Castle Town e converse com o Keats Servitor Sparky The Cat."], ["3", "Agora vá até Hot Springs e converse com o Cursed Summoner Keats. Nota: é o sapo à direita do Chef Jeremy."], ["4", "Depois, fale com o Chef Jeremy na área de Hot Springs e selecione a quest The Finest Ingredients - Part 1."], ["5", "Mate 50 de cada um destes monstros: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["6", "Com os itens prontos, vá até o Chef Jeremy, depois volte ao Cursed Summoner Keats e retorne a Sparky em Goddard Castle Town."], ["7", "Encontre a primeira Tablet of Vision na região da Tower of Insolence."], ["8", "Depois de conversar com a primeira Tablet of Vision, vá até a segunda Tablet of Vision, em Valley of Saints. Fale com ela uma vez, mate todos os Quest Monsters ao redor e fale novamente com a mesma Tablet of Vision."], ["9", "Encontre a próxima Tablet of Vision em Border Outpost. Ao falar com ela, aparece o Quest Monster Vision Guardian Shakiel. Depois de derrotá-lo, fale novamente com a mesma Tablet of Vision."], ["10", "Vá a Goddard e fale com Summoner Belinda."], ["11", "Escolha a aliança com os Ketra Orcs ou os Varka Silenos. Nota: escolha os Ketra Orcs."], ["11.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Você deve conquistar a confiança dos novos aliados: colete 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["11.2", "Ao terminar, volte a Wahkan e selecione a quest \"Magical Power of Water\". Entre no Ketra Orc Outpost e encontre Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Recomendo sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["11.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, p e a próxima Tablet of Vision perto de Wall of Argos."], ["19", "Siga até a próxima Table of Vision [sic], perto de Forrest of the Dead. Ao falar com ela, aparece o Quest Monster Lich King Icarus."], ["20", "Após derrotá-lo, converse com o NPC que estava lutando contra ele. Depois, fale novamente com a mesma Tablet of Vision. Vá e converse com Hardin em Hardin's Academy."], ["Final", "Parabéns! Agora você é um Soultaker!"]], "Spellhowler": [["1", "Vá ao quarto andar de Ivory Tower e fale com Grand Magister Fairen."], ["2", "Fairen vai mandar você a Goddard para visitar a Magister Kamilen na Dark Elf Guild."], ["3", "Kamilen pede que você se encontre com o Information Broker Mist, em uma piscina dentro de Hot Springs."], ["4", "Mist pede um Ice Crystal antes de ajudar."], ["5", "Visite o Chef Jeremy em Hot Springs (perto do Chef Donath) e pegue a quest The Finest Ingredients - Part 1 para conseguir o Ice Crystal."], ["6", "Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["7", "Retorne a Jeremy, que te entregará o Ice Crystal. Leve-o a Mist, que te dará o Investigative Report."], ["8", "Volte a Kamilen com o Investigative Report, e ela te dará o Resonance Amulet - 1."], ["9", "Vá à primeira Tablet of Vision, ao sul de Tower of Insolence. Pegue um gatekeeper para Northern Enchanted Valley em Hunters Village e siga correndo até o Tablet."], ["10", "O tablet irá pegar o Resonance Amulet - 1 e te enviar para outro Tablet of Vision em Valley of Saints. Quando chegar, caia no vale, pois o tablet fica embaixo."], ["12", "Mate os Guardians of Forbidden Knowledge até obter o Resonance Amulet - 2 e depois fale com o tablet novamente. Ele vai levar o amuleto e direcioná-lo para o próximo Tablet."], ["13", "Depois de conseguir o amuleto, fale com o Tablet novamente. Ele vai levar o amuleto e direcioná-lo para a próxima Tablet, a nordeste de Ketra Orc Outpost, perto de Pilgrims Temple."], ["14", "Ao falar com o Tablet, aparece o Fallen Angel Allector. Se você se buffar durante a luta, ou alguém te ajudar a matá-lo, ele desaparece."], ["15", "Ao matar o Fallen Angel Allector, você obterá o Resonance Amulet - 3. Fale com o Tablet novamente, e ele te mandará de volta a Kamilen."], ["16", "Volte a Kamilen. Ela vai pedir que você escolha um lado. Recomendo os Ketra Orcs, porque os Varkas são mais fáceis de matar."], ["16.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Você terá que ganhar a confiança de seus novos aliados. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["16.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Você deve ir dentro do Ketra Orc Outpost e encontrar Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Aconselho sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["16.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a \"Key of Thief\" no inventário, clique na caixa para abri-la."], ["17", "Volte a Asefa, que vai te entregar a Divine Stone of Wisdom."], ["18", "Depois de obter a Divine Stone of Wisdom, volte a Kamilen. Ela te dará o Resonance Amulet - 4."], ["19", "Ela te mandará ao lado norte do Garden of Beasts para falar com outro Tablet. O tablet levará o Resonance Amulet - 4."], ["20", "Depois de visitar o Tablet, volte a Kamilen. Ela te dará os detalhes para matar 700 mobs."], ["20.1", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["20.2", "Depois que o Archon of Halisha morrer, você obterá o Resonance Amulet - 5. Siga para o noroeste de Shrine of the Loyal e encontre a próxima Tablet of Vision."], ["21", "O tablet leva o Resonance Amulet - 5 e direciona para o último Tablet, fora de Hunters Village."], ["22", "Ao falar com ele, aparecem Medina Blackheart e o Stopper Unknown. O Stopper Unknown é o mob que você deve matar, mas não pode matá-lo com todas as habilidades, senão ele simplesmente desaparece. Depois de matá-lo, fale com Medina Blackheart, que te dará o Resonance Amulet - 6."], ["23", "Fale com o tablet novamente. Ele vai levar o Resonance Amulet - 6 e te mandar de volta a Grand Magister Fairen, no quarto andar de Ivory Tower."], ["Final", "Parabéns! Você é um Storm Screamer (Spellhowler)."]], "Shillien Elder": [["1", "A quest começa em Hardin's Private Academy com a Magister Anastia. Ela manda você a Goddard visitar a Saint of Light Agnes."], ["2", "Agnes fica ao lado da Magic Shop, cercada por alguns seguidores. Ela diz que você deve visitar o Chef Duncan em Hot Springs e levar algum alimento para ela."], ["3", "Duncan pede um Ice Crystal antes de ajudar."], ["4", "Visite o Chef Jeremy em Hot Springs (perto do Chef Donath) e pegue a quest The Finest Ingredients - Part 1 para conseguir o Ice Crystal."], ["5", "Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["6", "Retorne a Jeremy, que te entregará o Ice Crystal. Leve-o a Duncan, que te dará um pouco de comida e te mandará de volta a Agnes."], ["7", "Vá à primeira Tablet of Vision, ao sul de Tower of Insolence. Pegue um gatekeeper para Northern Enchanted Valley em Hunters Village e siga correndo até o Tablet."], ["8", "O tablet irá pegar o Resonance Amulet - 1 e te enviar para outro Tablet of Vision em Valley of Saints. Quando chegar, caia no vale, pois o tablet fica embaixo."], ["9", "Vá até perto de Border Outpost e fale com o tablet. Depois, aparece o quest monster Fallen Angel Naverius, que você deve matar. Antes de falar com o tablet, deixe o Buff Up e os potes de HP de lado: nenhuma ajuda externa pode ser usada, senão o mob desaparece. A melhor forma de matá-lo é dar root e transformar-se em Inquisitor. Depois de matá-lo, fale com o tablet, que te enviará a Goddard para falar com Kamilen, na Dark Elf Guild."], ["10", "Kamilen pede que você escolha um lado. Recomendo os Ketra Orcs, porque os Varkas são mais fáceis de matar."], ["10.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Você terá que ganhar a confiança de seus novos aliados. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["10.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Você deve ir dentro do Ketra Orc Outpost e encontrar Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Aconselho sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["10.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a \"Key of Thief\" no inventário, clique na caixa para abri-la."], ["11", "Volte a Asefa, que vai te entregar a Divine Stone of Wisdom."], ["12", "Depois, vá para o norte do Garden of Beasts para falar com outro Tablet."], ["13", "Volte a Kamilen, que vai te dar os detalhes para matar os 700 mobs."], ["14.1", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["14.2", "Depois que o Archon of Halisha morrer, siga para o noroeste de Shrine of the Loyal e encontre a próxima Tablet of Vision."], ["15", "O tablet te direciona para o último Tablet, que fica em Forest of the Dead. Depois de falar com ele, aparecem o quest monster Fallen Angel Tanakia e o NPC Abyssal Saint Elcardia. Mate o mob e fale com o NPC antes que ele desapareça."], ["16", "Fale com o Tablet novamente e, depois, vá a Hardin's Academy para falar com Anastia."], ["Final", "Parabéns! Você se tornou um Shillien Saint (Shillien Elder)."]], "Abyss Walker": [["1", "A quest começa em Hunters Village. Fale com o Hunter Guild Member Black Cat, que fica numa pequena cabana atrás do gatekeeper."], ["2", "Ele te dará um Guardian Angel of the Tablet (Quest Item) e pedirá que você fale com Master Drakon, na Dark Elf Guild em Goddard."], ["3", "Drakon pede que você fale com o Master Chef Donath em Hot Springs (nas barracas)."], ["4", "Donath pede um Ice Crystal."], ["5", "Visite o Chef Jeremy em Hot Springs (perto do Chef Donath) e pegue a quest The Finest Ingredients - Part 1 para conseguir o Ice Crystal."], ["6", "Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["7", "Retorne a Jeremy, que te entregará o Ice Crystal. Leve-o a Donath, que te dará o Donath's Note - Vol.1."], ["8", "Dê o Donath's Note - Vol.1 a Master Drakon, e ele te dá o Resonance Amulet - 1."], ["9", "Vá à primeira Tablet of Vision, ao sul de Tower of Insolence. Pegue um gatekeeper para Northern Enchanted Valley em Hunters Village e siga correndo até o Tablet."], ["10", "O tablet irá pegar o Resonance Amulet - 1 e te enviar para outro Tablet of Vision em Valley of Saints. Quando chegar, caia no vale, pois o tablet fica embaixo."], ["11", "Mate os Guardians of Forbidden Knowledge até obter o Resonance Amulet - 2 e depois fale com o tablet novamente."], ["12", "O próximo Tablet fica a sudeste Hermit fornecerá os detalhes para matar os 700 mobs."], ["19.1", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["19.2", "Depois que o Archon of Halisha morrer, você obterá o Resonance Amulet - 5. Siga para o noroeste de Shrine of the Loyal e encontre a próxima Tablet of Vision."], ["20", "O tablet levará o Resonance Amulet - 5 e vai direcioná-lo para o último tablet, em Forest of the Dead."], ["21", "Depois de falar com o tablet, aparecem o Monument Defender Azrael e a Aria Firstmatter. Mate o Monument Defender Azrael (sem usar habilidades) e depois fale com a Aria Firstmatter para obter o Resonance Amulet - 6."], ["22", "Fale com o tablet novamente. Ele vai levar o Resonance Amulet - 6 e te mandar de volta a Hunter Guild Master Black Cat, na cabana atrás do gatekeeper em Hunters Village."], ["Final", "Parabéns! Você se tornou um Ghost Hunter (Abyss Walker)."]], "Spectral Dancer": [["1", "Vá a Hardin's Academy e fale com o NPC Dark Knight Mordred. Ele te dá o Guild Report (quest item) e manda você falar com a Spellbook Seller Elena, em Goddard Castle Town."], ["2", "Elena está dentro da igreja. Ela fala sobre o Ancient Language Dictionary e diz que você deve obtê-lo com Bavarin, na área de Hot Springs."], ["3", "O caminho mais fácil até Bavarin é o teleporte para a entrada de Forge of the Gods, seguindo a estrada. Ele está se banhando na hot spring."], ["4", "Visite Chef Jeremy em Hot Springs, não muito longe de Bavarin, e selecione \"The Finest Ingredients - Part 1\" na lista de quests."], ["5", "Chef Jeremy diz que dará o cristal de gelo se você ajudá-lo a juntar carne para uma receita secreta. Mate 50 de cada: HotSprings Atrox ou HotSprings Atoxspawn, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["6", "Ao voltar, ele te dará o cristal de gelo e um jarro de molho de soja. Volte a Bavarin, que te dará o Ancient Language Dictionary. Entregue-o a Spellbook Seller Elena em Goddard Castle Town."], ["7", "Elena te entrega o Resonance Amulet - 1. Encontre o Tablet of Vision na região da Tower of Insolence, ao sul da montanha de TOI. Clique nele, e ele te mandará ao Valley of Saints para encontrar o próximo tablet."], ["8", "O segundo tablet está cercado por angelic quest mobs."], ["9", "Clique no segundo tablet. Ele diz que os angels têm a Stone of Commune. Você deve matar todos os mobs."], ["10", "Você receberá o Resonance Amulet - 2. Volte e clique no Tablet of Vision. Você deve encontrar o próximo tablet a sudoeste de Ketra Orc Outpost, em Goddard."], ["11", "Ao falar com ele, aparece o quest monster Hallate's Dancer Lillian. Mate-o."], ["12", "Você obterá o Resonance Amulet - 3. Agora fale com o tablet. Você deve voltar a Elena em Goddard, porque ela tem uma stone of commune."], ["13", "Elena diz que a stone of commune dela está quebrada. Você precisa se aliar com os Ketra Orcs ou os Varka Silenos. Escolha os Orcs (escolhi os orcs porque os varkas são mais fáceis de matar)."], ["14.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Você terá que ganhar a confiança de seus novos aliados. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["14.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Você deve ir dentro do Ketra Orc Outpost e encontrar Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Aconselho sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["14.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a \"Key of Thief\" no inventário, clique na caixa para abri-la."], ["15", "Volte até Asefa, que vai te dar a Divine Stone of Wisdom."], ["16", "O tablet está cercado por Ketra Orc mobs. Ignore-os. Clique no tablet e volte a Elena."], ["17", "Você deve matar 700 mobs para que o quest boss Halisha apareça. Vá ao Shrine of the Loyal."], ["18", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["19", "Ao terminar, você obterá o Resonance Amulet - 5. Agora encontre o tablet of vision perto de Wall of Argos."], ["20", "Ele te diz para encontrar o próximo, a nordeste do tablet de Rune Castle Town, perto de Forrest of the Dead."], ["21", "Ao clicar nele, aparece o Death Lord Hallate. Mate-o. Quando ele morrer, converse com o anjo que estava lutando contra ele, e você obterá o Resonance Amulet - 6. Clique no tablet outra vez: ele vai pedir que você volte a Dark Knight Mordred, em Hardin's Academy."], ["Final", "Parabéns! Agora você é um Spectral Dancer!"]], "Shillien Knight": [["1", "Galadrid te dá o Guild Report e manda você a Goddard Castle Tower para falar com Samael."], ["2", "Samael pede que você vá à área de Hot Springs falar com Bavarin."], ["3", "Bavarin diz que precisa de Ice Crystals para fazer o item. Visite Chef Jeremy em Hot Springs (ao lado) e selecione \"The Finest Ingredients - Part 1\" na lista de quests."], ["4", "Chef Jeremy dará o Ice Crystal se você ajudá-lo a juntar carne para uma receita secreta. Mate 50 de cada: HotSprings Nepenthes, HotSprings Atrox ou HotSprings Atoxspawn e HotSprings Bandersnatchlings."], ["5", "Ao voltar, ele te dará os ice crystals. Volte a Bavarin, que te dará o Ancient Language Dictionary. Entregu ercado por Ketra Orc mobs. Ignore-os. Clique no tablet e volte a Samael."], ["15", "Você deve matar 700 mobs para que o quest boss Halisha apareça. Vá ao Shrine of the Loyal."], ["16", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o. Quando terminar, você obterá o Resonance Amulet - 5. Agora encontre o tablet of vision perto de Wall of Argos."], ["17", "Ele te diz para encontrar o próximo tablet em Hunters Village."], ["18", "Ao clicar nele, aparece o Assassin Pezel. Mate-o. Quando ele morrer, converse com o NPC que estava lutando contra ele, e você obterá o Resonance Amulet - 6. Clique no tablet outra vez: ele vai pedir que você volte a Galadrid, em Hardin's Academy."], ["Final", "Parabéns! Agora você é um Shillien Templar (Shillien Knight)."]], "Phantom Ranger": [["1", "A quest começa com a visita a Guild President Bernard, que fica numa pequena cabana atrás do gatekeeper em Hunters Village."], ["2", "Ele te entrega um Guardian Angel of the Tablet - Vol.2 e te manda à warehouse para falar com o Information Broker Grimst."], ["3", "Grimst pede que você se encontre com o Gemcutter Gedrik, que fica na Blacksmith de Goddard."], ["4", "Gedrik precisa de um Ice Crystal antes de ajudar."], ["5", "Visite o Chef Jeremy em Hot Springs (perto do Chef Donath) e pegue a quest The Finest Ingredients - Part 1 para conseguir o Ice Crystal."], ["6", "Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["7", "Retorne a Jeremy, que te entregará o Ice Crystal. Leve-o a Gedrik, que te dará um Ice Crystal Gemstone."], ["8", "Leve a Gemstone a Grimst, que te dará o Resonance Amulet - 1."], ["9", "Vá à primeira Tablet of Vision, ao sul de Tower of Insolence. Pegue um gatekeeper para Northern Enchanted Valley em Hunters Village e siga c vine Stone of Wisdom ao Pilgrim of Darkness. Em troca, ele te dará o Resonance Amulet - 4."], ["17", "Ele te manda ao lado norte do Garden of Beasts para falar com outro Tablet. O tablet levará o Resonance Amulet - 4 e te enviará ao outro Pilgrim of Darkness, que fica fora de Goddard, no caminho para Ketra."], ["18", "O segundo Pilgrim of Darkness fornece os detalhes de como matar os 700 mobs."], ["18.1", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["18.2", "Depois que o Archon of Halisha morrer, você obterá o Resonance Amulet - 5. Siga para o noroeste de Shrine of the Loyal e encontre a próxima Tablet of Vision."], ["19", "O tablet levará o Resonance Amulet - 5 e vai direcioná-lo para o último tablet, fora de Hunters Village."], ["20", "Depois de falar com o tablet, aparecem o Monument Defender Azrael e a Winter Hunter Kadyth. Mate o Monument Defender Azrael (sem usar habilidades) e depois fale com a Winter Hunter Kadyth para pegar o Resonance Amulet - 6."], ["21", "Fale com o tablet novamente. Ele vai levar o Resonance Amulet - 6 e te mandar de volta a Guild President Bernard, na cabana atrás do gatekeeper em Hunters Village."], ["22", "Fale com Guild President Bernard e conclua a quest."], ["Final", "Parabéns! Você se tornou um Ghost Sentinel (Phantom Ranger)."]], "Phantom Summoner": [["1", "Vá ao quarto andar de Ivory Tower e fale com Grand Magister Fairen."], ["2", "Fairen vai te enviar a Aden, para visitar a Summoner Noctisee na Dark Elf Guild."], ["3", "Noctisee pede que você se encontre com Magister Kamilen, na Dark Elf Guild em Goddard."], ["4", "Kamilen pede um Ice Crystal."], ["5", "Visite o Chef Jeremy em Hot Springs (perto do Chef Donath) e pegue a quest The Finest Ingredients - Part 1 para conseguir o Ice Crystal."], ["6", "Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["7", "Retorne a Jeremy, que te entregará o Ice Crystal. Leve-o a Kamilen, que te dará o Antidote."], ["8", "Volte a Summoner Noctisee em Aden com o Antidote, e ela te dará o Resonance Amulet - 1."], ["9", "Vá à primeira Tablet of Vision, ao sul de Tower of Insolence. Pegue um gatekeeper para Northern Enchanted Valley em Hunters Village e siga correndo até o Tablet."], ["10", "O tablet irá pegar o Resonance Amulet - 1 e te enviar para outro Tablet of Vision em Valley of Saints. Quando chegar, caia no vale, pois o tablet fica embaixo."], ["11", "Mate os Guardians of Forbidden Knowledge até obter o Resonance Amulet - 2 e depois fale com o tablet novamente."], ["12", "O próximo tablet fica a sudeste de Ketra Orc Outpost, perto de Borderland Fortress. Se quiser, vá pelas bordas e evite todos os mobs."], ["13", "Depois de falar com o Tablet, aparece o Vision Guardian Shakiel. Se você se buffar durante a luta, ou alguém te ajudar a matá-lo, ele desaparece."], ["14", "Ao matar o Vision Guardian Shakiel, você obterá o Resonance Amulet - 3. Fale com o Tablet novamente, que te orientará a ver o Hermit dentro do Ketra Orc Outpost. Volte a Goddard e vá andando até o Ketra Orc Outpost, perto da entrada."], ["15", "Volte a Kamilen, no quarto andar de Ivory Tower. Ela vai pedir que você escolha um lado. Recomendo os Ketra Orcs, porque os Varkas são mais fáceis de matar."], ["15.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Você terá que ganhar a confiança de seus novos aliados. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["15.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Você deve ir dentro do Ketra Orc Outpost e encontrar Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Aconselho sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["15.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a \"Key of Thief\" no inventário, clique na caixa para abri-la."], ["16", "Volte até Asefa, que vai te dar a Divine Stone of Wisdom."], ["17", "Depois de obter a Divine Stone of Wisdom, volte a Kamilen. Ela te dará o Resonance Amulet - 4."], ["18", "Ela te manda ao lado norte do Garden of Beasts para falar com outro Tablet. O tablet levará o Resonance Amulet - 4 e te enviará a Summoner Noctisee."], ["19", "Noctisee fornece os detalhes para matar os 700 mobs."], ["19.1", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["19.2", "Depois que o Archon of Halisha morrer, você obterá o Resonance Amulet - 5. Siga para o noroeste de Shrine of the Loyal e encontre a próxima Tablet of Vision."], ["20", "O tablet levará o Resonance Amulet - 5 e vai direcioná-lo para o último tablet, em Forest of the Dead."], ["21", "Depois de falar com o tablet, aparecem o Servitor Mysterious e o NPC Mysterious Servitor. Mate o Servitor Mysterious (sem usar habilidades) e depois fale com o NPC Mysterious Servitor para obter o Resonance Amulet - 6."], ["22", "Fale com o tablet novamente. Ele vai levar o Resonance Amulet - 6 e te mandar de volta a Grand Magister Fairen, no quarto andar de Ivory Tower."], ["Final", "Parabéns! Você se tornou um Spectral Master (Phantom Summoner)."]], "Elven Elder": [["1", "Comece visitando o High Priest Hollint no Templo em Oren. Ele te onstro, você ganhará o Resonance Amulet - 3. Fale com o tablet, depois volte a Goddard e fale com Magister Alminas, que vai pedir que você escolha uma aliança com os Ketra Orcs ou os Varka Silenos. Recomendo os Ketra Orcs, porque os Varkas são mais fáceis de matar."], ["12.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Você terá que ganhar a confiança de seus novos aliados. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["12.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Você deve ir dentro do Ketra Orc Outpost e encontrar Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Aconselho sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["12.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a \"Key of Thief\" no inventário, clique na caixa para abri-la."], ["13", "Volte até Asefa, que vai te entregar a Divine Stone of Wisdom."], ["14", "Volte a Magister Alminas em Goddard. Ele te dará o Resonance Amulet - 4. Depois, vá ao próximo Tablet of Vision, ao sul de Monastery of Silence. Fale com ele e volte a Alminas em Goddard."], ["15", "Ele te enviará para perto de Shrine of the Loyal, para você matar o Archon of Halisha."], ["16", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["17", "Após derrotar o Archon of Halisha, você ganhará o Resonance Amulet - 4. Depois, siga para o próximo Tablet of Vision, ao norte de Wall of Argos."], ["18", "Depois, encontre outro Tablet of Vision perto de Forsaken Plains. Fale com o Tablet e ajude o Silver Feyshar a matar o Quest Monster Unknown Stopper."], ["19", "Depois de matar o Unknown Stopper, fale rapidamente com o Silver Feyshar, pois ele some muito rápido, e você precisa falar com ele para seguir a quest. Depois, fale com o Tablet de novo para receber o Resonance Amulet - 6."], ["Final", "Parabéns! Você é um Mystic Muse. Volte a Ivory Tower e fale novamente com Arkenias."]], "Moonlight Sentinel": [["1", "Vá a Hunters Village e fale com Guild President Bernard, que fica atrás do gatekeeper."], ["2", "Ele te entrega o Guardian Angel of the Tablet - Vol.2 e te manda falar com Information Broker Grimst, na Warehouse em Hunters Village."], ["3", "Grimst pede que você vá buscar o Ice Cream com o Information Broker Mist, na área de Hot Springs. Mist precisa de Ice Crystals."], ["4", "Visite o Chef Jeremy em Hot Springs (perto do Chef Donath) e pegue a quest The Finest Ingredients - Part 1 para conseguir o Ice Crystal."], ["5", "Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes. Depois, volte a Chef Jeremy, que te dará o Ice Crystal."], ["6", "Vá até Mist e entregue o Ice Crystal. Ele te dá o Ice Cream. Leve-o a Grimst em Hunters Village, e em troca ele te dará o Resonance Amulet - 1."], ["7", "Encontre o Tablet of Vision ao sul de Tower of Insolence (num morro). Clique nele."], ["8", "O tablet levará o amuleto e te enviará a outro Tablet of Vision em Valley of Saints. Ande até em cima da marca e, em seguida, salte para baixo."], ["9", "Mate os Guardians of Forbidden Knowledge até obter o Resonance Amulet - 2 e depois fale com o tablet novamente."], ["10", "O próximo Tablet fica fora do Ketra Orc Outpost, no extremo nordeste. Se estiver atento, você pode seguir pelas bordas e evitar todos os mobs. Depois de falar com o Tablet, aparece o Monument Watcher Ezekiel. Mate-o."], ["11", "Depois que o Monument Watcher Ezekiel for derrotado, você obterá o Resonance Amulet - 3. Fale com o Tablet, depois vá encontrar o Pilgrim of Darkness, na estrada de Goddard para Wall of Argos."], ["12", "O Pilgrim of Darkness pede que você escolha um lado. Recomendo os Ketra Orcs, porque os Varkas são mais fáceis de matar."], ["12.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Você terá que ganhar a confiança de seus novos aliados. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["12.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Você deve ir dentro do Ketra Orc Outpost e encontrar Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Aconselho sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["12.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a \"Key of Thief\" no inventário, clique na caixa para abri-la."], ["13", "Volte até Asefa, que vai te entregar a Divine Stone of Wisdom."], ["14", "Volte ao Pilgrim of Darkness. Ele te dará o Resonance Amulet - 4 e pede que você vá ao próximo Table of Vision."], ["15", "Ele te enviará ao lado norte de Garden of Beasts para falar com outro Tablet. O Tablet levará o Resonance Amulet - 4."], ["16", "Ele te enviará ao segundo Pilgrim of Darkness, na saída de Goddard em direção a Ketra Orc Outpost. Ele te dará os detalhes para matar os 700 mobs."], ["17", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["18", "Depois que o Archon of Halisha morrer, você obterá o Resonance Amulet - 5. Agora encontre o tablet of vision perto da Wall of Argos."], ["19", "Ele então te fala para encontrar o próximo tablet em Forsaken Plains."], ["20", "Depois de falar com o tablet, aparecem o Monument Defender Azrael e o Winter Hunter Kadyth. Mate o Monument Defender Azrael."], ["21", "Quando ele morrer, converse com o Winter Hunter Kadyth, que estava lutando com ele, e você obterá o Resonance Amulet - 6."], ["22", "Clique no tablet outra vez. Ele vai pedir que você volte a Bernard, em Hunters Village."], ["Final", "Parabéns! Você agora é um Moonlight Sentinel!"]], "Eva's Templar": [["1", "Comece indo ver Master Sinden na Warrior Guild em Aden. Ele te dará um Mother Tree Guardian e vai mandar você falar com Master Bronwyn, na Warrior Guild em Goddard."], ["2", "Bronwyn diz que você precisa de Pure Ice, que pode ser obtido falando com o Chef Donath em Hot Springs."], ["3", "O Chef Donath diz que pode fazer o Pure Ice se você trouxer os seguintes ingredientes:"], ["3.1", "Ice Crystals, obtidos com a quest The Finest Ingredients - Part 1. Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["3.2", "1 Big White Fat Fish, que pode ser obtido pescando (entre os níveis 23 e 25) ou comprando de outros jogadores."], ["4", "Quando você tiver os 2 itens, volte a Donath, que faz o Pure Ice. Leve-o de volta a Bronwyn."], ["5", "Bronwyn pega o Pure Ice e te dá o Resonance Amulet - 1."], ["6", "Vá até o primeiro Tablet of Vision, perto da entrada norte de Enchanted Valley. Pegue o teleporte de Hunter's Village para Northern Pathway of Enchanted Valley e ande até o local."], ["7", "Este Tablet levará o amuleto e te enviará a outro Tablet of Vision, em Valley of Saints. Pegue o teleporte de Goddard para Valley of Saints e siga para o local mostrado no mapa. Acima dele, há um lugar para pular até chegar ao Tablet."], ["8", "O Tablet vai te mandar matar o Guardian of Forbidden Knowledge até obter o Resonance Amulet - 2."], ["9", "Depois de conseguir o amuleto, fale com o Tablet novamente. Ele vai levar o amuleto e direcioná-lo para o próximo Tablet."], ["10", "Este Tablet fica no lado norte de Border Outpost, perto de Western Fortress. Depois de falar com ele, aparece o Bound Elf Panacea. Ajuda externa não é permitida, então faça seus buffs e cure-se antes de começar."], ["11", "Depois que o Bound Elf Panacea morrer, você obterá o Resonance Amulet - 3. Fale com o Tablet novamente. Ele vai levar o amuleto e te direcionar de volta a Master Sinden, na Warrior Guild em Aden."], ["12", "Master Sinden pede que você escolha um lado. Recomendo os Ketra Orcs, porque os Varkas são mais fáceis de matar."], ["12.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Você terá que ganhar a confiança de seus novos aliados. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["12.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Você deve ir dentro do Ketra Orc Outpost e encontrar Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Aconselho sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["12.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a \"Key of Thief\" no inventário, clique na caixa para abri-la."], ["13", "Volte até Asefa, que vai te entregar a Divine Stone of Wisdom."], ["14", "Depois, volte a Master Sinden. Ele te dará o Resonance Amulet - 4 e pede que você vá ao próximo Tablet of Vision."], ["15", "Depois de visitar o Tablet, vá ver Priest Cerenas. Ele te dará os detalhes para matar os 700 mobs."], ["16", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["17", "O Tablet pega o Resonance Amulet - 5 e te direciona para o último Tablet, encontrado em Forsaken Plains, como mostrado no mapa."], ["18", "Quando você clicar nele, aparece o Cursed Kesadein. Mate-o. Quando ele morrer, converse com o NPC que estava lutando com ele, e você obterá o Resonance Amulet - 6. Clique no tablet outra vez: ele vai pedir que você volte a Master Sinden, em Aden Castle Town."], ["Final", "Parabéns! Agora você é um Eva's Templar."]], "Plains Walker": [["1", "Comece visitando a Hunter Guild Master Black Cat, que fica numa pequena cabana atrás do gatekeeper em Hunters Village."], ["2", "Ela te dará um Guardian Angel of the Tablet (Quest Item) e pedirá que você fale com a Spellbook Seller Elena em Goddard. Elena fica na entrada do templo de Goddard."], ["3", "Elena pede que você fale com o Master Chef Donath em Hot Springs."], ["4", "O Master Chef Donath precisa de Ice Crystals."], ["5", "Visite o Chef Jeremy em Hot Springs (perto do Chef Donath) e pegue a quest The Finest Ingredients - Part 1 para conseguir o Ice Crystal. Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["6", "Vá até o Chef Donath e entregue os Ice Crystals. Ele te dá o Donath's Dish. Leve-o a Elena, no Castelo de Goddard. Em troca, ela te dá o Resonance Amulet - 1."], ["7", "Encontre o Tablet of Vision ao sul de Tower of Insolence (num morro). Clique nele."], ["8", "O tablet levará o amuleto e te enviará a outro Tablet of Vision em en of Beasts para falar com outro Tablet. O Tablet levará o Resonance Amulet - 4 e te enviará ao outro Hermit (não o mesmo de Ketra), que fica do lado de fora da entrada de Wall of Argos."], ["16", "Esse Hermit te dará os detalhes para matar os 700 mobs."], ["17", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["18", "Depois que o Archon of Halisha morrer, você obterá o Resonance Amulet - 5. Agora encontre o tablet of vision perto da Wall of Argos."], ["19", "Ele então te fala para encontrar o próximo tablet em Hunters Village. Depois de falar com o tablet, aparecem o Monument Defender Azrael e o Eternidade Wanderer Stars. Mate o Monument Defender Azrael."], ["20", "Quando ele morrer, converse com o Eternidade Wanderer Stars, que estava lutando com ele, e você obterá o Resonance Amulet - 6. Clique no tablet outra vez: ele vai pedir que você volte a Black Cat, em Hunters Village."], ["Final", "Parabéns! Agora você é um Wind Rider (Plains Walker)."]], "Sword Singer": [["1", "Comece visitando a Master Raien, na Warrior Guild em Aden. Ela manda você visitar o Blacksmith Feynn em Goddard e te dá um livro sobre a queda de um Sword Singer, chamado \"Criticism of Biel's Song\"."], ["2", "Feynn está em Goddard. Ele pede que você busque a Bitter Cold Beer com o Chef Donath, na área de Hot Springs."], ["3", "O Master Chef Donath precisa de Ice Crystals e de Big White Fat Fish para fazer a cerveja. Visite Chef Jeremy em Hot Springs (perto do Chef Donath) e pegue a quest The Finest Ingredients - Part 1 para conseguir o Ice Crystal."], ["4", "Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["5", "Para conseguir o Big White Fat Fish, você precisa pescá-lo. Nota: suas skills de pesca precisam estar no nível 23-25."], ["6", "Volte ao Blacksmith Feynn, que vai ficar bêbado enquanto ouve sua música e te contará a história. Vá até o Chef Donath e entregue os materiais. Ele te dá a Bitter Cold Beer. Leve-a a Feynn, em Goddard Castle. Você obtém o Resonance Amulet - 1."], ["7", "Encontre o Tablet of Vision perto da Tower of Insolence, ao sul de TOI. Ele te enviará ao segundo Tablet of Vision, em Valley of Saints."], ["8", "Clique no segundo Tablet of Vision. Ele diz que os Guardians of Forbidden Knowledge têm a Stone of Commune. Mate todos os mobs até receber o Resonance Amulet - 2. Depois, volte e clique no Tablet of Vision."], ["9", "Encontre o próximo Tablet of Vision em Ketra Orc Outpost. Ao falar com ele, aparece o Quest Monster Sword Player Biel. Depois de derrotá-lo, fale novamente com o mesmo Tablet of Vision. Você obterá o Resonance Amulet - 3."], ["10", "Vá até a Beast Farm e fale com o Beast Herder Tunatun. Você precisa se aliar com os Ketra Orcs ou os Varka Silenos. Escolha os Ketra Orcs, porque os Varkas são mais fáceis de matar."], ["10.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["10.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Entre no Ketra Orc Outpost e encontre Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada."], ["10.3", "Asefa pede que você roube um totem do Varka Silenos Outpost. Compre uma Key of Thief na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a Key of Thief no inventário, clique na caixa para abri-la."], ["11", "Volte até Asefa, que te dará a Divine Stone of Wisdom. Depois, volte a Tunatun. Ele te dará o Resonance Amulet - 4 e pede que você vá à próxima Tablet of Vision, entre Ketra Orc e Monastery of Silence."], ["12", "Agora vá a Goddard e encontre Priest Cerenas."], ["13", "Você terá que matar 701 mobs para que o Quest Monster Archon of Halisha apareça. Vá ao Shrine of the Loyalty. Monstros para caçar: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards."], ["14", "Quando terminar, você obterá o Resonance Amulet - 5. Agora encontre o Tablet of Vision perto da Wall of Argos."], ["15", "Ele te fala para encontrar o próximo tablet em Hunters Village. Ao clicar nele, aparece o Fallen Angel Narcissus. Mate-o."], ["16", "Quando ele morrer, converse com o NPC que estava lutando com ele, e você obterá o Resonance Amulet - 6. Clique no tablet outra vez: ele vai pedir que você volte a Master Raien, em Aden Castle Town."], ["Final", "Parabéns! Agora você é um Sword Muse (Sword Singer)."]], "Maestro": [["1", "Vá a Rune Village e fale com o Chief Golem Crafter Telson. Ele te dá um Guilds Secret Report (quest item) e pede que você fale com o Master Tobald em Goddard."], ["2", "Tobald manda você ir até o Blueprint Seller Borodin, perto dele."], ["3", "Borodin diz que ajuda se você levar um Ice Crystal."], ["4", "Para obter o Ice Crystal, vá falar com o Chef Jeremy e selecione The Finest Ingredients - Part 1."], ["5", "Chef Jeremy dá o Ice Crystal se você ajudar a coletar carnes para uma receita secreta. Mate 50 de cada: HotSprings Bandersnatches, HotSprings Atrox ou HotSprings Atrox Spawn e HotSprings Nepenthes."], ["6", "Ao voltar, Jeremy te dá o Ice Crystal. Volte a Borodin, que te dará o Coolant of the Repaired Wilma #3. Leve-o a Tobald."], ["7", "Tobald diz que você precisa de uma Stone of Commune de todas as seis Tablets."], ["8", "O primeiro Tablet of Vision fica em uma colina perto da Tower of Insolence. Clique nele, e ele te manda ao Valley of Saints para encontrar o próximo tablet."], ["9", "O segundo tablet está cercado por angelic quest mobs. Clique nele: ele diz que os angels têm a Stone of Commune. Você deve matar todos os mobs."], ["10", "Você receberá o Resonance Amulet - 2. Volte e clique no Tablet of Vision. Você deve encontrar o próximo tablet."], ["11", "O terceiro Tablet fica perto de Ketra Orc. Desta vez, você lutará contra o quest mob Archangel Iconoclasis, que aparece. Fale com o Tablet para receber o quest item. Vá a Goddard e fale com Tobald."], ["12", "Tobald diz que a Stone of Commune está quebrada. Você precisa se aliar com os Ketra Orcs ou os Varka Silenos. Escolha os Ketra Orcs, porque os Varkas são mais fáceis de matar."], ["12.1", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Alliance. Colecione 100 badges de Varka Silenos Recruits, Footman, Scouts, Hunters e Shamans."], ["12.2", "Quando terminar, retorne ao Wahkan e selecione a quest \"Magical Power of Water\". Você deve ir dentro do Ketra Orc Outpost e encontrar Asefa, o guia de almas mortas. NÃO bata em nenhum Ketra Orc, nem nos membros da party, senão a aliança será quebrada. (Aconselho sair da party, porque os orcs não atacaram você, mas podem atacar seus amigos.)"], ["12.3", "Asefa pede que você roube um totem no Varka Silenos Outpost. Compre uma \"Key of Thief\" na loja antes, para destrancar o chest. NÃO lute com nenhum Silenos nesta parte, senão você será \"visto\" e terá que voltar a Asefa. Sua party precisa matar os Silenos no caminho até o posto avançado. Fique fora da party. A caixa com o totem fica atrás de uma tenda. Com a \"Key of Thief\" no inventário, clique na caixa para abri-la."], ["13", "Ao terminar, volte ao Wahkan, que te recompensa com a Mark of Ketra's Alliance - Level 1. Depois, retorne ao Wahkan para o nível 2 e selecione \"Magical Power of Water\". Você NÃO precisa obter o nível 3 da aliança."], ["14", "Volte até Asefa, que vai te entregar a Divine Stone of Wisdom."], ["15", "Volte a Tobald em Goddard. Ele te dá o Resonance Amulet - 4 e pede que você vá à próxima table of vision."], ["16", "O tablet está cercado por Ketra Orc mobs. Ignore-os e clique no tablet."], ["17", "Volte a Tobald. Você deve matar 700 mobs para que o quest boss Halisha apareça. Vá ao Shrine of the Loyal. Monstros para caçar: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights, Shrine Guards e Archon of Halisha."], ["18", "Mate 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece. Mate-o."], ["19", "Depois que o Archon of Halisha morrer, você obterá o Resonance Amulet - 5. Agora encontre o tablet of vision perto da Wall of Argos."], ["20", "Ele então te fala para encontrar o próximo tablet em Rune Village. Ao clicar nele, aparece o Assassin Frost. Mate-o."], ["21", "Quando ele morrer, converse com o NPC que estava lutando com ele, e você obterá o Resonance Amulet - 6. Clique no tablet outra vez: ele vai pedir que você volte a Rune Village e fale com o NPC Chief Golem Crafter Telson."], ["Final", "Parabéns! Agora você é um Maestro."]], "Fortune Seeker": [["1", "Comece falando com o Chief Inspector Mond em Rune Castle Town."], ["2", "Ele pede que você vá a Goddard Castle Town falar com a Dark Elf Agent Pamela Aprodia."], ["3", "Ela pede que você fale com o Bavarin, na área de Hot Springs."], ["4", "Bavarin pede que você fale com o Chef Jeremy e selecione \"The Finest Ingredients - Part 1\" na lista de quests."], ["5", "Mate 50 de cada: HotSprings Atrox, HotSprings Bandersnatchlings e HotSprings Nepenthes."], ["6", "Depois de coletar tudo, volte a Jeremy, depois vá até Bavarin, que te dará o Ancient Language Dictionary."], ["7", "Vá a Goddard Town e fale com Pamela. Depois, encontre o Tablet of Vision perto da Tower of Insolence."], ["8", "Depois de falar com o primeiro Tablet of Vision, encontre o próximo Tablet, a oeste do Valley of Saints. Após falar com ele, mate todos os monstros ao redor e fale novamente com o Tablet of Vision."], ["9", "Vá ao próximo Tablet of Vision, em Wall of Argos. Ao falar com ele, aparece o monstro Archangel Iconoclasis. Depois de derrotá-lo, fale novamente com o mesmo Tablet of Vision."], ["10", "Vá falar com Pamela em Goddard e escolha uma aliança com os Ketra Orcs ou os Varka Silenos. Obs.: escolha os Ketra Orcs."], ["11", "Vá falar com o Ketra Messenger Wahkan e selecione a quest de Aliança."], ["12", "Para ganhar a confiança dos aliados, alcance o nível 2 da aliança. No primeiro passo, colecione 100 badges de Varka Silenos soldiers."], ["13", "Ao terminar, volte a Wahkan. Agora você precisa do nível 2: colecione 200 badges de Varka Silenos grunt e 100 de Varka Silenos officer."], ["14", "Ao terminar, volte a Wahkan, selecione \"Magical Power of Water\" na lista de quests e vá até Asefa, em Ketra Orc Outpost. Obs.: não mate nenhum Ketra Orc, e muito menos os membros da sua party, senão a aliança será quebrada."], ["15", "Asefa pede que você roube um totem do Varka Silenos Outpost. Antes, compre uma Key of Thief em qualquer loja, para destrancar o chest. Obs.: não lute com nenhum Silenos nesta parte, senão você terá que voltar a Asefa."], ["16", "Ao chegar ao Varka Outpost, a caixa com o totem está atrás de uma tenda. Vá até o chest e, com a Key of Thief no inventário, clique na caixa para abri-la."], ["17", "Volte a Asefa e depois vá até Pamela em Goddard. Agora encontre o próximo Table of Vision."], ["18", "Fale com o Tablet of Vision e depois volte a Pamela. Você deve matar 700 monstros para que o Quest Monster Halisha apareça. Local: Shrine of the Loyal. Monstros: Grave Scarabs, Scavenger Scarabs, Grave Ants, Scavenger Ants, Shrine Knights e Shrine Guards. Archon of Halisha em Imperial Tomb: ao matar o 701º, ele aparece."], ["19", "Quando terminar, encontre o Tablet of Vision perto da Wall of Argos."], ["20", "Depois, vá até o próximo Tablet of Vision, a nordeste de Rune Castle Town, perto de Forest of the Dead. Ao falar com ele, aparecem o Quest Monster Minervia Van Hacken e Pamela. Depois de derrotar o monstro, fale com Pamela."], ["21", "Fale com o Tablet novamente. Ele te manda voltar ao Chief Inspector Mond, em Rune Castle Town."], ["Final", "Parabéns! Agora você é um Fortune Seeker. Hora de farmar seus itens e treinar bastante!"]]};

function inv(){
  view.innerHTML=`<h1>Drops</h1><p class="sub">Itens que caem de monstros e raid bosses, com a localização de onde vêm.</p>`+QUESTS.map(q=>
    `<h3 style="font-weight:normal;color:#d9b879;margin-top:22px">${q}</h3><div class="box">`+
    ITEMS[q].filter(i=>DROP_ITEMS[q]&&DROP_ITEMS[q][i]).sort((x,y)=>DROP_STEP[q][x]-DROP_STEP[q][y]).map(i=>{const w=whereOf(q,i);
      const info=DROP_ITEMS[q][i]?`<span style="color:${isDone(DROP_STEP[q][i])?'#7fd39a':'#ff9a9a'}">${DROP_ITEMS[q][i]}</span>`:w.npcs.length?w.npcs.map(x=>`<span style="color:#f4d16d">${x.n}</span> <span class="muted">· ${x.l}</span>`).join('<br>'):'<span class="muted">Sem NPC (drop de monstro ou baú)</span>';
      const et=w.steps.length?'<span class="muted">etapa '+w.steps.join(', ')+'</span>':'';
      const got=isDone(DROP_STEP[q][i]);
      return `<div class="row" style="${got?'opacity:.6':''}"><span><b style="color:#ffffff;${got?'text-decoration:line-through':''}">${got?'✔ ':''}${i}</b><br>${et}</span><span style="text-align:right">${info}</span></div>`}).join('')+`</div>`).join('');
}
